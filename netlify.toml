[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: React Router ke routes (e.g. /dashboard, /budgets) refresh par 404 na dein
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite ke hashed assets ko long-term cache karo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
